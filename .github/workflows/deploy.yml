name: Deploy Kanariya

on:
  workflow_dispatch:
  push:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: |
            package-lock.json
            vault/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Install Vault dependencies
        run: npm ci --prefix vault

      - name: Run Vault tests
        run: npm --prefix vault test

      - name: Install Wrangler
        run: npm install -g wrangler@4.58.0

      - name: Run local runtime checks
        run: npm run test:runtime

      - name: Run Vault local runtime checks
        working-directory: vault
        run: npm run test:runtime

      - name: Validate Cloudflare secrets
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          missing=0
          if [ -z "${CF_API_TOKEN}" ]; then
            echo "::error::Missing required secret: CF_API_TOKEN"
            missing=1
          fi
          if [ -z "${CF_ACCOUNT_ID}" ]; then
            echo "::error::Missing required secret: CF_ACCOUNT_ID"
            missing=1
          fi
          exit "${missing}"

      - name: Update Worker secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          IP_HMAC_KEY: ${{ secrets.IP_HMAC_KEY }}
          ADMIN_KEY: ${{ secrets.ADMIN_KEY }}
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          MAILCHANNELS_API_KEY: ${{ secrets.MAILCHANNELS_API_KEY }}
        run: |
          set -euo pipefail
          if [ -n "${IP_HMAC_KEY}" ]; then
            printf '%s' "${IP_HMAC_KEY}" | wrangler secret put IP_HMAC_KEY
          fi
          if [ -n "${ADMIN_KEY}" ]; then
            printf '%s' "${ADMIN_KEY}" | wrangler secret put ADMIN_KEY
          fi
          for secret_name in WEBHOOK_URL SLACK_WEBHOOK_URL DISCORD_WEBHOOK_URL MAILCHANNELS_API_KEY; do
            if [ -n "${!secret_name}" ]; then
              printf '%s' "${!secret_name}" | wrangler secret put "${secret_name}"
            fi
          done

      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: wrangler deploy
