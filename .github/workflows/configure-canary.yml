name: Configure private Canary connection

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kanariya-vault-production
  cancel-in-progress: false

jobs:
  configure:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact dispatched commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: |
            package-lock.json
            vault/package-lock.json

      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix vault
          npm install -g wrangler@4.58.0

      - name: Verify source and configuration guards
        run: |
          npm test
          npm --prefix vault test
          python3 -m unittest discover -s tests -p 'deploy_vault_source_test.py'
          python3 -m unittest discover -s tests -p 'rotate_vault_dummy_test.py'
          python3 -m unittest discover -s tests -p 'configure_canary_connection_test.py'

      - name: Verify root and private Canary runtime
        run: |
          npm run test:runtime
          node scripts/check_canary_management.mjs

      - name: Verify Vault runtime
        working-directory: vault
        run: npm run test:runtime

      - name: Apply only the approved connection and absent key
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p .wrangler/canary-connection/reports
          python3 scripts/configure_canary_connection.py \
            --execute \
            --report .wrangler/canary-connection/reports/connection.json

      - name: Save connection evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: canary-connection-${{ github.sha }}-${{ github.run_id }}
          path: .wrangler/canary-connection/reports/*.json
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30
