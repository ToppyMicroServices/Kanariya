name = "kanariya-vault"
main = "src/worker.js"
compatibility_date = "2026-01-12"
workers_dev = false
preview_urls = false

[build]
command = "node scripts/prepare-viewer-assets.mjs"

# Set the actual Access-protected hostname before deployment.
# No deployment route, personal address, or production secret is checked in.
[vars]
PUBLIC_ORIGIN = "https://vault.invalid"
ACCESS_ISSUER = "https://unconfigured.cloudflareaccess.com"
ACCESS_AUDIENCE = "unconfigured"
# Mandatory dummy-only admission pin. Set these to the reviewed synthetic
# record's UUID and SHA-256 of its exact uploaded bytes. Invalid defaults deny all.
DUMMY_DOCUMENT_ID = "unconfigured"
DUMMY_RECORD_SHA256 = "unconfigured"

[observability]
enabled = false

[[durable_objects.bindings]]
name = "VAULT"
class_name = "VaultDocument"

[[migrations]]
tag = "v1-vault"
new_sqlite_classes = ["VaultDocument"]

[[r2_buckets]]
binding = "VAULT_DOCUMENTS"
bucket_name = "kanariya-vault-unconfigured"

# Required secret bindings: VAULT_WRAP_KEY, VAULT_AUDIT_KEY, VAULT_OWNER_SUB.
# Configure notification credentials as secrets, including sender/recipient addresses.
